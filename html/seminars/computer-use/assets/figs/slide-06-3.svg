<svg viewBox="0 0 1080 360" xmlns="http://www.w3.org/2000/svg" width="100%" role="img" aria-label="Computer Use 가 2026년 실용 임계점을 돌파한 3가지 동시 성숙: VISION(멀티모달 추론), MEMORY(Long Context), ACTION(Tool Use).">
<defs>
<filter id="sec3-card-shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.08"/></filter>
</defs>

<rect x="30" y="10" width="320" height="340" rx="14" fill="#FFFFFF" stroke="#F5F5F4" stroke-width="1" filter="url(#sec3-card-shadow)"/>
<rect x="30" y="10" width="320" height="4" fill="#0F2C59"/>
<rect x="54" y="40" width="96" height="32" rx="16" fill="#FFFFFF" stroke="#0F2C59" stroke-width="1.5"/>
<text x="102" y="61" font-family="Inter, sans-serif" font-weight="800" font-size="14" fill="#0F2C59" text-anchor="middle" letter-spacing="1.5">VISION</text>
<text x="54" y="148" font-family="Inter, 'Noto Sans KR', sans-serif" font-weight="700" font-size="32" fill="#1a1a1a">멀티모달 추론</text>
<text x="54" y="216" font-family="Inter, 'Noto Sans KR', sans-serif" font-weight="400" font-size="16" fill="#555555">텍스트 → 스크린샷·레이아웃 인식</text>
<text x="54" y="246" font-family="Inter, 'Noto Sans KR', sans-serif" font-weight="400" font-size="16" fill="#555555">버튼·아이콘 좌표 정확 인식</text>
<text x="54" y="322" font-family="Inter, 'Noto Sans KR', sans-serif" font-weight="700" font-size="14" fill="#0F2C59">→ ScreenSpot 84% · 좌표 인식 SOTA</text>

<rect x="380" y="10" width="320" height="340" rx="14" fill="#FFFFFF" stroke="#F5F5F4" stroke-width="1" filter="url(#sec3-card-shadow)"/>
<rect x="380" y="10" width="320" height="4" fill="#0F2C59"/>
<rect x="404" y="40" width="106" height="32" rx="16" fill="#FFFFFF" stroke="#0F2C59" stroke-width="1.5"/>
<text x="457" y="61" font-family="Inter, sans-serif" font-weight="800" font-size="14" fill="#0F2C59" text-anchor="middle" letter-spacing="1.5">MEMORY</text>
<text x="404" y="148" font-family="Inter, 'Noto Sans KR', sans-serif" font-weight="700" font-size="32" fill="#1a1a1a">Long Context</text>
<text x="404" y="216" font-family="Inter, 'Noto Sans KR', sans-serif" font-weight="400" font-size="16" fill="#555555">4K~32K → 100K~1M 토큰</text>
<text x="404" y="246" font-family="Inter, 'Noto Sans KR', sans-serif" font-weight="400" font-size="16" fill="#555555">수십 장 스크린샷 누적 유지</text>
<text x="404" y="322" font-family="Inter, 'Noto Sans KR', sans-serif" font-weight="700" font-size="14" fill="#0F2C59">→ 약 30배 확장 · 30-step 태스크 추적</text>

<rect x="730" y="10" width="320" height="340" rx="14" fill="#FFFFFF" stroke="#F5F5F4" stroke-width="1" filter="url(#sec3-card-shadow)"/>
<rect x="730" y="10" width="320" height="4" fill="#0F2C59"/>
<rect x="754" y="40" width="100" height="32" rx="16" fill="#FFFFFF" stroke="#0F2C59" stroke-width="1.5"/>
<text x="804" y="61" font-family="Inter, sans-serif" font-weight="800" font-size="14" fill="#0F2C59" text-anchor="middle" letter-spacing="1.5">ACTION</text>
<text x="754" y="148" font-family="Inter, 'Noto Sans KR', sans-serif" font-weight="700" font-size="32" fill="#1a1a1a">Tool Use</text>
<text x="754" y="216" font-family="Inter, 'Noto Sans KR', sans-serif" font-weight="400" font-size="16" fill="#555555">단순 함수 호출 → 마우스·키보드</text>
<text x="754" y="246" font-family="Inter, 'Noto Sans KR', sans-serif" font-weight="400" font-size="16" fill="#555555">스크롤·드래그·줌 세밀 제어</text>
<text x="754" y="322" font-family="Inter, 'Noto Sans KR', sans-serif" font-weight="700" font-size="14" fill="#0F2C59">→ 3사 표준 (Anthropic·OpenAI·Google)</text>
</svg>
