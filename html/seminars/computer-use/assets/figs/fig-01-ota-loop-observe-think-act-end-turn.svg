<svg viewBox="0 0 520 200" xmlns="http://www.w3.org/2000/svg" aria-labelledby="ota-title">
  <title id="ota-title">OTA Loop: Observe → Think → Act → 반복</title>
  <defs>
    <linearGradient id="nodeRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F2C59"/>
      <stop offset="100%" stop-color="#091F40"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0F2C59"/>
    </marker>
  </defs>
  <!-- 3 nodes -->
  <g>
    <circle cx="80" cy="100" r="42" fill="url(#nodeRed)"/>
    <text x="80" y="97" text-anchor="middle" font-family="Inter,Noto Sans KR,sans-serif" font-weight="900" font-size="13" fill="#fff" letter-spacing="-0.5">OBSERVE</text>
    <text x="80" y="114" text-anchor="middle" font-family="Inter,Noto Sans KR,sans-serif" font-size="9" fill="rgba(255,255,255,0.82)">스크린샷</text>
  </g>
  <g>
    <circle cx="260" cy="100" r="42" fill="url(#nodeRed)"/>
    <text x="260" y="97" text-anchor="middle" font-family="Inter,Noto Sans KR,sans-serif" font-weight="900" font-size="14" fill="#fff" letter-spacing="-0.5">THINK</text>
    <text x="260" y="114" text-anchor="middle" font-family="Inter,Noto Sans KR,sans-serif" font-size="9" fill="rgba(255,255,255,0.82)">CoT 추론</text>
  </g>
  <g>
    <circle cx="440" cy="100" r="42" fill="url(#nodeRed)"/>
    <text x="440" y="97" text-anchor="middle" font-family="Inter,Noto Sans KR,sans-serif" font-weight="900" font-size="14" fill="#fff" letter-spacing="-0.5">ACT</text>
    <text x="440" y="114" text-anchor="middle" font-family="Inter,Noto Sans KR,sans-serif" font-size="9" fill="rgba(255,255,255,0.82)">tool call</text>
  </g>
  <!-- Straight arrows left→right -->
  <path d="M 125 100 L 213 100" stroke="#0F2C59" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 305 100 L 393 100" stroke="#0F2C59" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <!-- Curved loop back Act → Observe -->
  <path d="M 440 58 C 440 10, 80 10, 80 58" stroke="#0F2C59" stroke-width="2" fill="none" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
  <text x="260" y="22" text-anchor="middle" font-family="Inter,Noto Sans KR,sans-serif" font-size="9.5" font-weight="700" fill="#0F2C59">loop until end_turn</text>
  <!-- Bottom label: output -->
  <text x="80" y="168" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="8.5" fill="#6B6B72">base64 image</text>
  <text x="260" y="168" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="8.5" fill="#6B6B72">next action</text>
  <text x="440" y="168" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="8.5" fill="#6B6B72">xdotool / PyAutoGUI</text>
</svg>
