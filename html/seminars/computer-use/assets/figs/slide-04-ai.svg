<svg viewBox="0 0 1080 280" xmlns="http://www.w3.org/2000/svg" width="100%" role="img" aria-label="Computer Use 데모: 카카오톡 → Word → 이메일 3단계 흐름. 한 번의 지시로 3개 앱을 넘나들며 업무를 완료한다.">
<defs>
<filter id="cuc-card-shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.08"/></filter>
<filter id="cuc-card-glow" x="-15%" y="-15%" width="130%" height="135%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0F2C59" flood-opacity="0.22"/></filter>
</defs>

<rect x="40" y="20" width="290" height="240" rx="14" fill="#FFFFFF" stroke="#F5F5F4" stroke-width="1" filter="url(#cuc-card-shadow)"/>
<rect x="40" y="20" width="290" height="3" fill="#0F2C59"/>
<circle cx="74" cy="68" r="20" fill="#0F2C59"/>
<text x="74" y="75" font-family="Inter, 'Noto Sans KR', sans-serif" font-weight="800" font-size="18" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="64" y="180" font-family="Inter, 'Noto Sans KR', sans-serif" font-weight="700" font-size="28" fill="#1a1a1a">카카오톡</text>
<text x="64" y="212" font-family="Inter, 'Noto Sans KR', sans-serif" font-weight="400" font-size="15" fill="#555555">채팅방 읽고 핵심 추출</text>

<path d="M 345 140 L 385 140" fill="none" stroke="#0F2C59" stroke-width="2.8" stroke-linecap="round"/>
<path d="M 376 132 L 388 140 L 376 148" fill="none" stroke="#0F2C59" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>

<rect x="395" y="20" width="290" height="240" rx="14" fill="#FFFFFF" stroke="#F5F5F4" stroke-width="1" filter="url(#cuc-card-shadow)"/>
<rect x="395" y="20" width="290" height="3" fill="#0F2C59"/>
<circle cx="429" cy="68" r="20" fill="#0F2C59"/>
<text x="429" y="75" font-family="Inter, 'Noto Sans KR', sans-serif" font-weight="800" font-size="18" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="419" y="180" font-family="Inter, 'Noto Sans KR', sans-serif" font-weight="700" font-size="28" fill="#1a1a1a">Word</text>
<text x="419" y="212" font-family="Inter, 'Noto Sans KR', sans-serif" font-weight="400" font-size="15" fill="#555555">보고서 초안 작성·표 삽입</text>

<path d="M 700 140 L 740 140" fill="none" stroke="#0F2C59" stroke-width="2.8" stroke-linecap="round"/>
<path d="M 731 132 L 743 140 L 731 148" fill="none" stroke="#0F2C59" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>

<rect x="750" y="20" width="290" height="240" rx="14" fill="#FFFFFF" stroke="#0F2C59" stroke-width="1.5" filter="url(#cuc-card-glow)"/>
<rect x="750" y="20" width="290" height="4" fill="#091F40"/>
<circle cx="784" cy="68" r="20" fill="#091F40"/>
<text x="784" y="75" font-family="Inter, 'Noto Sans KR', sans-serif" font-weight="800" font-size="18" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="774" y="180" font-family="Inter, 'Noto Sans KR', sans-serif" font-weight="700" font-size="28" fill="#1a1a1a">이메일</text>
<text x="774" y="212" font-family="Inter, 'Noto Sans KR', sans-serif" font-weight="400" font-size="15" fill="#555555">수신자·본문·첨부·전송</text>
