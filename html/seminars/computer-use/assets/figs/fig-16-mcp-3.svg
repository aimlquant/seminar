<text x="120" y="66" text-anchor="middle" font-family="Inter,Noto Sans KR,sans-serif" font-weight="700" font-size="7.5" fill="#fff">Confluence</text>
<rect x="22" y="98" width="132" height="100" rx="6" fill="url(#ssLocal)"/>
<text x="32" y="116" font-family="Inter,Noto Sans KR,sans-serif" font-weight="800" font-size="9" fill="#fff">Local · 이 세션</text>
<line x1="32" y1="122" x2="144" y2="122" stroke="rgba(255,255,255,0.45)"/>
<text x="32" y="138" font-family="Inter,Noto Sans KR,sans-serif" font-size="8" fill="rgba(255,255,255,0.94)">디버깅 MCP attach</text>
<text x="32" y="151" font-family="Inter,Noto Sans KR,sans-serif" font-size="8" fill="rgba(255,255,255,0.94)">테스트 도구 임시 추가</text>
<text x="32" y="180" font-family="Inter,Noto Sans KR,sans-serif" font-size="7.5" fill="rgba(255,255,255,0.85)">세션 종료시 사라짐 →</text>
<rect x="180" y="32" width="146" height="180" rx="8" fill="#fff" stroke="#6B6B72" stroke-width="1.3" stroke-dasharray="3 2"/>
<text x="188" y="48" font-family="Inter,Noto Sans KR,sans-serif" font-weight="800" font-size="9" fill="#6B6B72">Project B · 마케팅팀</text>
<rect x="188" y="56" width="62" height="14" rx="3" fill="#6B6B72"/>
<text x="219" y="66" text-anchor="middle" font-family="Inter,Noto Sans KR,sans-serif" font-weight="700" font-size="7.5" fill="#fff">Jira MCP</text>
<rect x="188" y="98" width="130" height="56" rx="6" fill="#FEF2F2" stroke="#0F2C59" stroke-width="1" stroke-dasharray="2 2"/>
<text x="198" y="115" font-family="Inter,Noto Sans KR,sans-serif" font-weight="800" font-size="9" fill="#0F2C59">✕ A 의 도구</text>
<text x="198" y="128" font-family="Inter,Noto Sans KR,sans-serif" font-size="8" fill="#0F2C59">사내 DB · Local 모두</text>
<text x="198" y="141" font-family="Inter,Noto Sans KR,sans-serif" font-size="8" fill="#0F2C59">접근 불가</text>
<text x="188" y="172" font-family="Inter,Noto Sans KR,sans-serif" font-size="8" fill="#6B6B72">↑ User 서랍 (GitHub · Slack)</text>
<text x="188" y="184" font-family="Inter,Noto Sans KR,sans-serif" font-size="8" fill="#6B6B72">만 양 프로젝트가 공유</text>
