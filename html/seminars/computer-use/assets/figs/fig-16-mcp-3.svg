<rect x="276" y="6" width="40" height="14" rx="3" fill="#6B6B72"/>
<text x="296" y="16" text-anchor="middle" font-family="Inter,Noto Sans KR,sans-serif" font-weight="700" font-size="7.5" fill="#fff">Slack</text>
<rect x="14" y="32" width="156" height="180" rx="8" fill="#fff" stroke="#6B6B72" stroke-width="1.3" stroke-dasharray="3 2"/>
<text x="22" y="48" font-family="Inter,Noto Sans KR,sans-serif" font-weight="800" font-size="9" fill="#6B6B72">Project A · 결제 시스템팀</text>
<rect x="22" y="56" width="60" height="14" rx="3" fill="#6B6B72"/>
<text x="52" y="66" text-anchor="middle" font-family="Inter,Noto Sans KR,sans-serif" font-weight="700" font-size="7.5" fill="#fff">사내 DB</text>
