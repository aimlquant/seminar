<circle cx="36" cy="31" r="1.6" fill="#0F2C59"/>
<text x="68" y="24" font-family="Inter,Noto Sans KR,sans-serif" font-weight="900" font-size="13" fill="#0F2C59">Local</text>
<text x="110" y="24" font-family="Inter,Noto Sans KR,sans-serif" font-weight="600" font-size="9.5" fill="#6B6B72">· 세션 한정 (임시 서랍)</text>
<text x="68" y="38" font-family="Inter,Noto Sans KR,sans-serif" font-size="8.8" fill="#6B6B72">현재 세션만 유효 — 실험·일회성 도구</text>
<text x="16" y="58" font-family="Inter,Noto Sans KR,sans-serif" font-size="8" fill="#71717A">예: 디버깅용 임시 MCP — 세션 종료시 자동 폐기</text>
</g>
