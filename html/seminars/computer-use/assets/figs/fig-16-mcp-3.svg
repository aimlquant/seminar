<text x="360" y="290" text-anchor="middle" font-family="Inter,Noto Sans KR,sans-serif" font-size="8.8" fill="#6B6B72">Local ⊂ Project ⊂ User · 작은 서랍의 도구는 다른 서랍에서 보이지 않는다 — 격리 경계가 곧 안전 경계</text>
