<svg viewBox="0 0 720 304" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="MCP 권한 스코프 — User / Project / Local 3단계 서랍 비유와 격리 경계">
<defs>
<linearGradient id="ssLocal" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0F2C59"/><stop offset="100%" stop-color="#091F40"/></linearGradient>
</defs>
<rect x="0" y="0" width="720" height="304" fill="#FAFAF9"/>
<text x="360" y="22" text-anchor="middle" font-family="Inter,Noto Sans KR,sans-serif" font-weight="800" font-size="11" fill="#6B6B72" letter-spacing="0.04em">권한 스코프 3단계 · 도구가 어디까지 보이는가</text>
<!-- group: left column — 3 drawer cards -->
<g transform="translate(20, 44)">
<rect x="0" y="0" width="320" height="68" rx="8" fill="#fff" stroke="#6B6B72" stroke-width="1.4"/>
<rect x="0" y="0" width="5" height="68" fill="#6B6B72"/>
