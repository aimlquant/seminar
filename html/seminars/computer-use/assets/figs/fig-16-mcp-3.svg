<text x="68" y="38" font-family="Inter,Noto Sans KR,sans-serif" font-size="8.8" fill="#6B6B72">프로젝트별 격리 — 해당 리소스만 접근 가능</text>
<text x="16" y="58" font-family="Inter,Noto Sans KR,sans-serif" font-size="8" fill="#71717A">예: 사내 Confluence · DB MCP — 팀 단위로 묶임</text>
</g>
<g transform="translate(20, 200)">
<rect x="0" y="0" width="320" height="68" rx="8" fill="#fff" stroke="#0F2C59" stroke-width="1.4"/>
<rect x="0" y="0" width="5" height="68" fill="url(#ssLocal)"/>
<rect x="16" y="18" width="40" height="26" rx="3" fill="none" stroke="#0F2C59" stroke-width="1.5"/>
