<rect x="30" y="13" width="12" height="6" rx="1" fill="#6B6B72"/>
<circle cx="36" cy="31" r="1.6" fill="#6B6B72"/>
<text x="68" y="24" font-family="Inter,Noto Sans KR,sans-serif" font-weight="900" font-size="13" fill="#6B6B72">User</text>
<text x="106" y="24" font-family="Inter,Noto Sans KR,sans-serif" font-weight="600" font-size="9.5" fill="#6B6B72">· 전역 (개인 서랍)</text>
<text x="68" y="38" font-family="Inter,Noto Sans KR,sans-serif" font-size="8.8" fill="#6B6B72">개인 계정 공통 — 모든 프로젝트에서 공유</text>
<text x="16" y="58" font-family="Inter,Noto Sans KR,sans-serif" font-size="8" fill="#71717A">예: GitHub · Slack MCP — 어디서나 쓰는 기본 도구셋</text>
</g>
<g transform="translate(20, 122)">
<rect x="0" y="0" width="320" height="68" rx="8" fill="#fff" stroke="#6B6B72" stroke-width="1.4"/>
<rect x="0" y="0" width="5" height="68" fill="#6B6B72"/>
<rect x="16" y="18" width="40" height="26" rx="3" fill="none" stroke="#6B6B72" stroke-width="1.5"/>
<rect x="30" y="13" width="12" height="6" rx="1" fill="#6B6B72"/>
<circle cx="36" cy="31" r="1.6" fill="#6B6B72"/>
<text x="68" y="24" font-family="Inter,Noto Sans KR,sans-serif" font-weight="900" font-size="13" fill="#6B6B72">Project</text>
