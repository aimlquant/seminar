<svg viewBox="0 0 720 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="세 처방의 공통점 — 사전 완결">
<defs>
<linearGradient id="cmCore" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0F2C59"/><stop offset="100%" stop-color="#091F40"/></linearGradient>
<marker id="cmArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F2C59"/></marker>
</defs>
<rect x="0" y="0" width="720" height="240" fill="#FAFAF9"/>

<text x="20" y="20" font-family="Inter,Noto Sans KR,sans-serif" font-weight="900" font-size="10" fill="#6B6B72">앞에서 본 세 가지 처방</text>
<rect x="14" y="32" width="340" height="56" rx="6" fill="#fff" stroke="#0F2C59"/>
<text x="26" y="50" font-family="Inter,Noto Sans KR,sans-serif" font-weight="900" font-size="11" fill="#0F2C59">Failure Fallback</text>
<text x="346" y="50" text-anchor="end" font-family="Inter,Noto Sans KR,sans-serif" font-size="8" fill="#6B6B72">§5.4 Silent Failure</text>
<text x="26" y="66" font-family="Inter,Noto Sans KR,sans-serif" font-size="8.5" fill="#6B6B72">프롬프트 말미 "실패 시 @담당자 DM" 강제</text>
<text x="26" y="80" font-family="JetBrains Mono,monospace" font-size="8" fill="#0F2C59">→ 프롬프트에 사전 완결</text>
