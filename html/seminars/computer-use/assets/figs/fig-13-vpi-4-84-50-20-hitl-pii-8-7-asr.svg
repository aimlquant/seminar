<svg viewBox="0 0 720 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="VPI 방어 4계층 ASR 감쇠 막대그래프 — 기본 84% 에서 다층 방어 후 8.7% 로 감소">
