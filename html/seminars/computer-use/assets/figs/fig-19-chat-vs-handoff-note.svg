<svg viewBox="0 0 720 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Chat vs Handoff Note 비교">
<defs>
<linearGradient id="hoChat" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#6B6B72"/><stop offset="100%" stop-color="#0f2c59"/></linearGradient>
<linearGradient id="hoNote" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0F2C59"/><stop offset="100%" stop-color="#091F40"/></linearGradient>
<marker id="hoArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B6B72"/></marker>
<marker id="hoArrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F2C59"/></marker>
</defs>
<rect x="0" y="0" width="720" height="240" fill="#FAFAF9"/>
<rect x="14" y="14" width="340" height="212" rx="10" fill="#fff" stroke="#6B6B72" stroke-width="1.3"/>
<rect x="14" y="14" width="340" height="30" rx="10" fill="url(#hoChat)"/>
<rect x="14" y="28" width="340" height="16" fill="url(#hoChat)"/>
<text x="28" y="34" font-family="Inter,Noto Sans KR,sans-serif" font-weight="900" font-size="11" fill="#fff">Chat 모드</text>
<text x="342" y="34" text-anchor="end" font-family="Inter,Noto Sans KR,sans-serif" font-weight="700" font-size="8.5" fill="rgba(255,255,255,0.85)">실시간 대화 · 즉시 보완</text>
<rect x="30" y="56" width="100" height="28" rx="4" fill="#F5F5F4" stroke="#6B6B72"/>
<text x="80" y="74" text-anchor="middle" font-family="Inter,Noto Sans KR,sans-serif" font-size="9" fill="#0f2c59">"요약해 줘"</text>
<path d="M 130 70 L 150 70" stroke="#6B6B72" stroke-width="1.4" marker-end="url(#hoArr)"/>
<rect x="152" y="56" width="100" height="28" rx="4" fill="#F5F5F4" stroke="#6B6B72"/>
<text x="202" y="74" text-anchor="middle" font-family="Inter,Noto Sans KR,sans-serif" font-size="9" fill="#0f2c59">에이전트 응답</text>
<path d="M 252 70 L 272 70" stroke="#6B6B72" stroke-width="1.4" marker-end="url(#hoArr)"/>
<rect x="274" y="56" width="66" height="28" rx="4" fill="#F5F5F4" stroke="#6B6B72"/>
<text x="307" y="74" text-anchor="middle" font-family="Inter,Noto Sans KR,sans-serif" font-size="8.5" fill="#0f2c59">수정 지시</text>
<path d="M 307 84 Q 307 102 200 102 Q 80 102 80 90" stroke="#6B6B72" stroke-width="1.3" stroke-dasharray="3 2" fill="none" marker-end="url(#hoArr)"/>
<text x="184" y="118" text-anchor="middle" font-family="Inter,Noto Sans KR,sans-serif" font-size="8" fill="#6B6B72">반복 루프 — 부족하면 다시 물어볼 수 있다</text>
<rect x="28" y="132" width="310" height="82" rx="6" fill="#F5F5F4" stroke="#F5F5F4"/>
<text x="40" y="150" font-family="Inter,Noto Sans KR,sans-serif" font-weight="800" font-size="9" fill="#0f2c59">특징</text>
<text x="40" y="166" font-family="Inter,Noto Sans KR,sans-serif" font-size="8.5" fill="#6B6B72">• 프롬프트 짧음 · 맥락 자동 공유</text>
<text x="40" y="180" font-family="Inter,Noto Sans KR,sans-serif" font-size="8.5" fill="#6B6B72">• 실행 중 조정 가능 · 실패 = 다시 시도</text>
<text x="40" y="194" font-family="Inter,Noto Sans KR,sans-serif" font-size="8.5" fill="#6B6B72">• 적합: 동기 · 대화형 ChatGPT 같은 사용</text>
<text x="40" y="208" font-family="Inter,Noto Sans KR,sans-serif" font-size="8.5" fill="#6B6B72">• 한계: 비동기 · stateless · 24/7 에 부적합</text>
<rect x="368" y="14" width="338" height="212" rx="10" fill="#fff" stroke="#0F2C59" stroke-width="1.5"/>
<rect x="368" y="14" width="338" height="30" rx="10" fill="url(#hoNote)"/>
<rect x="368" y="28" width="338" height="16" fill="url(#hoNote)"/>
<text x="382" y="34" font-family="Inter,Noto Sans KR,sans-serif" font-weight="900" font-size="11" fill="#fff">Handoff Note 모드</text>
<text x="694" y="34" text-anchor="end" font-family="Inter,Noto Sans KR,sans-serif" font-weight="700" font-size="8.5" fill="rgba(255,255,255,0.85)">인수인계 · 사전 완결</text>
<rect x="384" y="56" width="306" height="62" rx="4" fill="#F5F5F4" stroke="#0F2C59"/>
<text x="396" y="72" font-family="Inter,Noto Sans KR,sans-serif" font-weight="800" font-size="9" fill="#0F2C59">프롬프트 (단일 전달)</text>
<text x="396" y="86" font-family="JetBrains Mono,monospace" font-size="8.5" fill="#0F0F10">① 맥락 · ② 단계 · ③ 예외</text>
<text x="396" y="100" font-family="JetBrains Mono,monospace" font-size="8.5" fill="#0F0F10">④ 출력 · ⑤ 실패 폴백 · ⑥ 멱등성</text>
<text x="396" y="114" font-family="Inter,Noto Sans KR,sans-serif" font-size="8.5" fill="#0F2C59">추가 질문 불가 — 빠진 건 실패로 직결</text>
<path d="M 537 118 L 537 138" stroke="#0F2C59" stroke-width="1.6" marker-end="url(#hoArrR)"/>
<rect x="384" y="140" width="306" height="30" rx="4" fill="#FEF2F2" stroke="#0F2C59"/>
<text x="537" y="158" text-anchor="middle" font-family="Inter,Noto Sans KR,sans-serif" font-weight="800" font-size="9" fill="#0F2C59">에이전트 · 단 한 번의 실행</text>
<rect x="384" y="176" width="306" height="46" rx="4" fill="#F5F5F4" stroke="#F5F5F4"/>
<text x="396" y="190" font-family="Inter,Noto Sans KR,sans-serif" font-weight="800" font-size="9" fill="#0f2c59">특징</text>
<text x="396" y="203" font-family="Inter,Noto Sans KR,sans-serif" font-size="8" fill="#6B6B72">• 단일 실행 · 실패는 프롬프트 내 Fallback 이 처리</text>
<text x="396" y="214" font-family="Inter,Noto Sans KR,sans-serif" font-size="8" fill="#6B6B72">• 적합: 비동기 · stateless · 24/7 루틴 / 한계: 실행 중 조정 불가</text>
</svg>
