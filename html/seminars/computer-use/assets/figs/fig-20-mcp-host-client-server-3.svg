  <path d="M 226 100 L 254 100" stroke="#0F2C59" stroke-width="2" fill="none" marker-end="url(#arrMcp)"/>
  <path d="M 254 140 L 226 140" stroke="#0F2C59" stroke-width="1.5" stroke-dasharray="3 3" fill="none" marker-end="url(#arrMcp)"/>
  <path d="M 465 100 L 493 100" stroke="#0F2C59" stroke-width="2" fill="none" marker-end="url(#arrMcp)"/>
