<svg viewBox="0 25 720 175" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="APA 하이브리드 실행 플로우 — Agent 판단 + RPA 실행의 4단계 결합">
<defs>
<linearGradient id="finalApaStep" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0F2C59"/><stop offset="100%" stop-color="#091F40"/></linearGradient>
<linearGradient id="finalApaCard" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fff"/><stop offset="100%" stop-color="#FAFAF9"/></linearGradient>
<marker id="finalApaArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F2C59"/></marker>
</defs>
<rect x="0" y="0" width="720" height="200" fill="#FAFAF9"/>
<path d="M 590 64 C 590 32, 270 32, 270 64" stroke="#0F2C59" stroke-width="1.6" stroke-dasharray="4 3" fill="none" marker-end="url(#finalApaArr)"/>
<rect x="40" y="86" width="140" height="74" rx="8" fill="url(#finalApaCard)" stroke="#6B6B72" stroke-width="1.3"/>
<circle cx="110" cy="74" r="13" fill="url(#finalApaStep)"/>
<text x="110" y="79" text-anchor="middle" font-family="JetBrains Mono,monospace" font-weight="900" font-size="12" fill="#fff">1</text>
<text x="110" y="110" text-anchor="middle" font-family="Inter,Noto Sans KR,sans-serif" font-weight="800" font-size="11" fill="#0F0F10">예외 감지</text>
<text x="110" y="128" text-anchor="middle" font-family="Inter,Noto Sans KR,sans-serif" font-size="8.5" fill="#6B6B72">스크린샷으로</text>
<text x="110" y="142" text-anchor="middle" font-family="Inter,Noto Sans KR,sans-serif" font-size="8.5" fill="#6B6B72">이상 상황 포착</text>
<text x="110" y="180" text-anchor="middle" font-family="JetBrains Mono,monospace" font-weight="800" font-size="8" fill="#6B6B72">[Agent]</text>
<path d="M 180 124 L 200 124" stroke="#0F2C59" stroke-width="2" fill="none" marker-end="url(#finalApaArr)"/>
<rect x="200" y="86" width="140" height="74" rx="8" fill="url(#finalApaCard)" stroke="#6B6B72" stroke-width="1.3"/>
<circle cx="270" cy="74" r="13" fill="url(#finalApaStep)"/>
<text x="270" y="79" text-anchor="middle" font-family="JetBrains Mono,monospace" font-weight="900" font-size="12" fill="#fff">2</text>
<text x="270" y="110" text-anchor="middle" font-family="Inter,Noto Sans KR,sans-serif" font-weight="800" font-size="11" fill="#0F0F10">판단</text>
<text x="270" y="128" text-anchor="middle" font-family="Inter,Noto Sans KR,sans-serif" font-size="8.5" fill="#6B6B72">우회 경로</text>
<text x="270" y="142" text-anchor="middle" font-family="Inter,Noto Sans KR,sans-serif" font-size="8.5" fill="#6B6B72">추론</text>
<text x="270" y="180" text-anchor="middle" font-family="JetBrains Mono,monospace" font-weight="800" font-size="8" fill="#6B6B72">[CUA]</text>
<path d="M 340 124 L 360 124" stroke="#0F2C59" stroke-width="2" fill="none" marker-end="url(#finalApaArr)"/>
<rect x="360" y="86" width="140" height="74" rx="8" fill="url(#finalApaCard)" stroke="#6B6B72" stroke-width="1.3"/>
<circle cx="430" cy="74" r="13" fill="url(#finalApaStep)"/>
<text x="430" y="79" text-anchor="middle" font-family="JetBrains Mono,monospace" font-weight="900" font-size="12" fill="#fff">3</text>
<text x="430" y="110" text-anchor="middle" font-family="Inter,Noto Sans KR,sans-serif" font-weight="800" font-size="11" fill="#0F0F10">실행</text>
<text x="430" y="128" text-anchor="middle" font-family="Inter,Noto Sans KR,sans-serif" font-size="8.5" fill="#6B6B72">결정 경로를</text>
<text x="430" y="142" text-anchor="middle" font-family="Inter,Noto Sans KR,sans-serif" font-size="8.5" fill="#6B6B72">100% 정확도로 재개</text>
<text x="430" y="180" text-anchor="middle" font-family="JetBrains Mono,monospace" font-weight="800" font-size="8" fill="#6B6B72">[RPA]</text>
<path d="M 500 124 L 520 124" stroke="#0F2C59" stroke-width="2" fill="none" marker-end="url(#finalApaArr)"/>
<rect x="520" y="86" width="140" height="74" rx="8" fill="url(#finalApaCard)" stroke="#6B6B72" stroke-width="1.3"/>
<circle cx="590" cy="74" r="13" fill="url(#finalApaStep)"/>
<text x="590" y="79" text-anchor="middle" font-family="JetBrains Mono,monospace" font-weight="900" font-size="12" fill="#fff">4</text>
<text x="590" y="110" text-anchor="middle" font-family="Inter,Noto Sans KR,sans-serif" font-weight="800" font-size="11" fill="#0F0F10">ERP 반영</text>
<text x="590" y="128" text-anchor="middle" font-family="Inter,Noto Sans KR,sans-serif" font-size="8.5" fill="#6B6B72">결과 기록 ·</text>
<text x="590" y="142" text-anchor="middle" font-family="Inter,Noto Sans KR,sans-serif" font-size="8.5" fill="#6B6B72">이상 시 ②로 회귀</text>
<text x="590" y="180" text-anchor="middle" font-family="JetBrains Mono,monospace" font-weight="800" font-size="8" fill="#6B6B72">[ERP]</text>
